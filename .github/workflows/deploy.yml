name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch: # Adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Vite 8 needs Node 20.19+ or 22.12+
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # The .env file is not on GitHub, so the build gets the Sanity settings here.
          # These are public identifiers (they are visible in the browser anyway), not secrets.
          VITE_SANITY_PROJECT_ID: 79rzokps
          VITE_SANITY_DATASET: production
          VITE_SANITY_API_VERSION: 2026-09-25

      # GitHub Pages only knows the files that exist. For /portfolio/projects there is no file,
      # so it serves 404.html; making that a copy of index.html lets React Router show the page.
      - name: Create SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
